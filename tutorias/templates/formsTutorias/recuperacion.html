{% extends "layouts/base.html" %}
{% block content %}

<h1 class="text-center">REGISTRAR TUTORÍA DE RECUPERACIÓN</h1>
<h1>{{error}}</h1>
<!---------------------------------------------------------------------------------------------------------->
<!------- Formulario de Regitro de las Tutorías Grupales --------------------------------------------------->
<p><a href="/" class="btn btn-outline-primary"> Regresar </a></p>
<form action="/registro/tutoria/recuperacion/" class="p-2" method="post">
    {% csrf_token %}
    <ul class="list-group">
        <li class="list-group-item" name = "tutoria_recuperacion">
            <div id="tutoriaRecuperacion">
                <p><b>Instrucciones: </b>Favor de indicar unidad de aprendizaje y carrera</p>
                <div class="form-group">
                    <label class="form-label p-2" for="unidad_recuperacion">Unidad de aprendizaje en recuperación <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="unidad_recuperacion" name="unidad_recuperacion" required>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="carrera_recuperacion">Carrera <b class="text-danger">*</b></label>
                    <select class="form-select text-dark" style="background-color: lightgray;" id="carrera_recuperacion" name="carrera_recuperacion" required>
                        <option value="isc">Ingeniería en Sistemas Computacionales</option>
                        <option value="iia">Ingeniería en Inteligencia Artificial</option>
                        <option value="lcd">Licenciatura en Ciencia de Datos</option>
                        <option value="isisa">ISISA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="numero_hombres_recuperacion">Número de hombres <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="numero_hombres_recuperacion" name="numero_hombres_recuperacion" required>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="numero_mujeres_regularizacion">Número de mujeres <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="numero_mujeres_recuperacion" name="numero_mujeres_recuperacion" required>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="lista_alumnos_regularizacion">Incluya la liga al archivo en formato PDF con la lista de alumnos <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="lista_alumnos_recuperacion" name="lista_alumnos_recuperacion" required>
                </div>
            </div>
        </li>          
        <button class="btn btn-primary">Guardar</button>
    </ul>
</form>

{% endblock %}
