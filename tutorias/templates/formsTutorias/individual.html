{% extends "layouts/base.html" %}
{% block content %}

<h1 class="text-center">REGISTRAR TUTORÍA INDIVIDUAL</h1>
<h1>{{error}}</h1>
<!---------------------------------------------------------------------------------------------------------->
<!------- Formulario de Regitro de las Tutorías Grupales --------------------------------------------------->
<p><a href="/" class="btn btn-outline-primary"> Regresar </a></p>
<form action="/registro/tutoria/individual/" class="p-2" method="post">
    {% csrf_token %}
    <ul class="list-group">
        <li class="list-group-item" name = "tutoria_individual">
            <div id="tutoriaIndividual">
                <p><b>Instrucciones: </b>Favor de incluir los números de boleta y nombre de los alumnos para tutoría individual máximo 10 alumnos tutorados.</p>
                <div class="{% if total_tutorias > 0 %} d-none {% endif %}">
                    <div class="form-group">
                        <label class="form-label p-2" for="numero_hombres_individual">Número de hombres <b class="text-danger">*</b></label>
                        <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="numero_hombres_individual" name="numero_hombres_individual">
                    </div>
                    <div class="form-group">
                        <label class="form-label p-2" for="numero_mujeres_individual">Número de mujeres <b class="text-danger">*</b></label>
                        <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="numero_mujeres_individual" name="numero_mujeres_individual">
                    </div>
                    <div class="form-group">
                        <label class="form-label p-2" for="lista_alumnos_individual">Incluya la liga al archivo en formato PDF con la lista de alumnos <b class="text-danger">*</b></label>
                        <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="lista_alumnos_individual" name="lista_alumnos_individual">
                    </div>
                </div>
            </div>
        </li>
        <button class="btn btn-primary {% if total_tutorias > 0 %} d-none {% endif %}">Guardar</button>
    </ul>
</form>

{% endblock %}
