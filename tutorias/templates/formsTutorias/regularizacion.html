{% extends "layouts/base.html" %}
{% block content %}

<h1 class="text-center">REGISTRAR TUTORÍA DE REGULARIZACIÓN</h1>
<h1>{{error}}</h1>
<!---------------------------------------------------------------------------------------------------------->
<!------- Formulario de Regitro de las Tutorías Grupales --------------------------------------------------->
<p><a href="/" class="btn btn-outline-primary"> Regresar </a></p>
<form action="/registro/tutoria/regularizacion/" class="p-2" method="post">
    {% csrf_token %}
    <ul class="list-group">
        <li class="list-group-item" name = "tutoria_regularizacion">
            <div class="{% if total_tutorias > 0 %} d-none {% endif %}">
                <p><b>Instrucciones: </b>Favor de indicar anidad de aprendizaje, carrera y alumno asesor en caso de tenerlo</p>
                <div class="form-group">
                    <label class="form-label p-2" for="unidad_regularizacion">Unidad de aprendizaje a regularizar <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="unidad_regularizacion" name="unidad_regularizacion" required>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="carrera_regularizacion">Carrera <b class="text-danger">*</b></label>
                    <select class="form-select text-dark" style="background-color: lightgray;" id="carrera_regularizacion" name="carrera_regularizacion" required>
                        <option value="isc">Ingeniería en Sistemas Computacionales</option>
                        <option value="iia">Ingeniería en Inteligencia Artificial</option>
                        <option value="lcd">Licenciatura en Ciencia de Datos</option>
                        <option value="isisa">ISISA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="numero_hombres_regularizacion">Número de hombres <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="numero_hombres_regularizacion" name="numero_hombres_regularizacion" required>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="numero_mujeres_regularizacion">Número de mujeres <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="numero_mujeres_regularizacion" name="numero_mujeres_regularizacion" required>
                </div>
                <div class="form-group">
                    <label class="form-label p-2" for="lista_alumnos_regularizacion">Incluya la liga al archivo en formato PDF con la lista de alumnos <b class="text-danger">*</b></label>
                    <input type="text" class="form-control text-dark" style="background-color: lightgray;" id="lista_alumnos_regularizacion" name="lista_alumnos_regularizacion" required>
                </div>
            </div>
        </li>

        <button class="btn btn-primary {% if total_tutorias > 0 %} d-none {% endif %}">Guardar</button>
    </ul>
</form>

{% endblock %}
