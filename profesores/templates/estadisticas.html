{% extends "layouts/base.html" %}

{% block content %}
<h6 class="display-6 text-center">Estadísticas</h6>
<p><a href="/administrador/?periodo={{ periodo }}" class="btn btn-outline-primary"> Regresar </a></p>
<div class="row align-items-center">
	<div id="grafica_grupos" class="col" style="width: 600px;height:600px;"></div>
</div>
<div class="row align-items-center">
	<div id="grafica_alumnos" class="col" style="width: 600px;height:600px;"></div>
</div>
<script>
	const getOptionChar=async()=>{
		try {
			const response= await fetch("/administrador/estadisticas/get_char/{{ periodo }}");
			return await response.json();
		} catch (error) {
			alert(error)
		}
	}
	const initChart = async () => {
		const options = await getOptionChar()
		const grafica_g = echarts.init(document.getElementById("grafica_grupos"));
		const grafica_a = echarts.init(document.getElementById("grafica_alumnos"));
		
		grafica_g.setOption(options.grupos)
		grafica_a.setOption(options.alumnos)
	};
	window.addEventListener("load",async()=>{
		await initChart()
	});
</script>

{% endblock %}
