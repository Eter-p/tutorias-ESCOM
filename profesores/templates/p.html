<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Sistema de Tutorías</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .btn-custom {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container w-75">
        <div class="row g-3">
            <!-- Sección Iniciar Sesión -->
            <div class="col-md-6">
                <div class="container-box text-center">
                    <h2 class="text-primary fw-bold">🔑 Iniciar Sesión</h2>
                    <form>
                        <div class="mb-3 text-start">
                            <label for="usuario" class="form-label fw-bold">Usuario:</label>
                            <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu usuario">
                        </div>
                        <div class="mb-3 text-start">
                            <label for="password" class="form-label fw-bold">Contraseña:</label>
                            <input type="password" id="password" class="form-control" placeholder="Ingresa tu contraseña">
                        </div>
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                    </form>
                </div>
            </div>

            <!-- Sección Registro de Usuario -->
            <div class="col-md-6">
                <div class="container-box text-center">
                    <h2 class="text-success fw-bold">📝 Registrar Usuario</h2>
                    <form>
                        <div class="mb-3 text-start">
                            <label for="nombre" class="form-label fw-bold">Nombre:</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Tu nombre completo">
                        </div>
                        <div class="mb-3 text-start">
                            <label for="correoInstitucional" class="form-label fw-bold">Correo Institucional:</label>
                            <input type="email" id="correoInstitucional" class="form-control" placeholder="Correo institucional">
                        </div>
                        <div class="mb-3 text-start">
                            <label for="correoAlterno" class="form-label fw-bold">Correo Alterno:</label>
                            <input type="email" id="correoAlterno" class="form-control" placeholder="Correo alterno">
                        </div>
                        <button type="submit" class="btn btn-success btn-custom">Registrar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
