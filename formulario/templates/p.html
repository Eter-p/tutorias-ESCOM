<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Tutorías</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: auto;
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            justify-content: center;
        }
        .btn-square {
            width: 120px;
            height: 120px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        .btn-square:hover {
            transform: scale(1.05);
        }
        .btn-active {
            background-color: #007bff !important;
            color: white !important;
            border: 2px solid #0056b3;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container">
        <h2>Listado de Tutorías</h2>
        <p class="fw-bold">Profesores registrados:</p>
        
        <div class="btn-grid">
            <button class="btn btn-outline-primary btn-square btn-active" onclick="window.location.href='#grupales'">Grupales</button>
            <button class="btn btn-outline-success btn-square" onclick="window.location.href='#individuales'">Individuales</button>
            <button class="btn btn-outline-warning btn-square" onclick="window.location.href='#entre-pares'">Entre Pares</button>
            <button class="btn btn-outline-danger btn-square" onclick="window.location.href='#recuperacion'">Recuperación</button>
            <button class="btn btn-outline-dark btn-square" onclick="window.location.href='#regularizacion'">Regularización</button>
            <button class="btn btn-outline-info btn-square" onclick="window.location.href='#movilidad'">Movilidad</button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
